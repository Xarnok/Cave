<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fond sombre élégant -->
  <rect width="512" height="512" rx="100" fill="#0a0a0d" />
  
  <!-- Liquide rouge rempli (avec la courbe ovale du haut du liquide) -->
  <path d="M165,160 C165,160 210,210 256,210 C302,210 347,160 347,160 C347,270 305,335 256,360 C207,335 165,270 165,160 Z" fill="#9b111e" />
  
  <!-- Ouverture ovale supérieure du verre (fine et transparente pour voir la surface du vin) -->
  <ellipse cx="256" cy="160" rx="91" ry="24" fill="none" stroke="#d4af37" stroke-width="8" />
  
  <!-- Corps du verre (traits fins) -->
  <path d="M165,160 C165,270 207,335 256,360 C305,335 347,270 347,160" fill="none" stroke="#d4af37" stroke-width="8" stroke-linecap="round" />
  
  <!-- Tige fine du verre -->
  <rect x="248" y="360" width="16" height="70" fill="#d4af37" />
  
  <!-- Socle fin du verre -->
  <rect x="186" y="430" width="140" height="16" rx="8" fill="#d4af37" />
</svg>